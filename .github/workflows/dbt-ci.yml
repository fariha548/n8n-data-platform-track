name: dbt Slim CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: dbt deps
        run: dbt deps

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          my_project:
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: n8n-self-practice
                dataset: dbt_ci
                location: US
                threads: 4
                job_execution_timeout_seconds: 300
                job_retries: 1
                priority: interactive
            target: ci
          PROFILE

      - name: Download main branch manifest
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: store-manifest.yml
          branch: main
          name: dbt-manifest-main
          path: state
        continue-on-error: true

      - name: dbt build (state:modified+)
        env:
          DBT_CI_SCHEMA_SUFFIX: pr${{ github.event.pull_request.number }}
        run: |
          if [ -f state/manifest.json ]; then
            dbt build --select state:modified+ --target ci --state state --defer
          else
            echo "No baseline manifest found, running full build"
            dbt build --target ci
          fi

      - name: Cleanup - delete temporary PR dataset
        if: always()
        run: |
          bq rm -r -f -d n8n-self-practice:dbt_ci_pr${{ github.event.pull_request.number }} || true
